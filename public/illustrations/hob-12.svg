<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#F0FDF4"/>
  <!-- Ball Base -->
  <circle cx="50" cy="50" r="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Center Pentagon -->
  <polygon points="50,38 60,46 56,58 44,58 40,46" fill="#1E293B"/>
  <!-- Connecting Lines & Outer Pentagons -->
  <line x1="50" y1="38" x2="50" y2="22" stroke="#1E293B" stroke-width="2"/>
  <line x1="60" y1="46" x2="74" y2="40" stroke="#1E293B" stroke-width="2"/>
  <line x1="56" y1="58" x2="68" y2="70" stroke="#1E293B" stroke-width="2"/>
  <line x1="44" y1="58" x2="32" y2="70" stroke="#1E293B" stroke-width="2"/>
  <line x1="40" y1="46" x2="26" y2="40" stroke="#1E293B" stroke-width="2"/>
  <!-- Outer Patches -->
  <polygon points="50,18 42,22 46,30 54,30 58,22" fill="#1E293B"/>
  <polygon points="76,36 78,46 72,54 66,48 70,40" fill="#1E293B"/>
  <polygon points="24,36 30,40 34,48 28,54 22,46" fill="#1E293B"/>
</svg>
