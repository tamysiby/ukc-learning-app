<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Vocab Lesson - UKC Learning Portal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    try {
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0058bc",
              "primary-container": "#0070eb",
              "primary-fixed": "#d8e2ff",
              "on-primary": "#ffffff",
              "secondary": "#785900",
              "tertiary": "#a83206",
              "tertiary-container": "#ca4a20",
              "background": "#f8f9fa",
              "on-background": "#191c1d",
              "surface": "#f8f9fa",
              "on-surface": "#191c1d",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f3f4f5",
              "surface-container": "#edeeef",
              "surface-container-high": "#e7e8e9",
              "surface-container-highest": "#e1e3e4",
              "on-surface-variant": "#414755",
              "outline": "#717786",
              "outline-variant": "#c1c6d7",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Plus Jakarta Sans"],
              label: ["Inter"]
            }
          }
        }
      }
    } catch (_e) { }
  </script>
  <style>
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body">

  <!-- Header -->
  <header class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2 sm:gap-4">
      <div class="flex items-center gap-2.5">
        <div
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-primary text-on-primary flex items-center justify-center font-black text-lg sm:text-xl shadow-xs font-headline shrink-0">
          U
        </div>
        <div class="leading-tight">
          <span
            class="font-extrabold text-base sm:text-lg text-on-surface tracking-tight font-headline block sm:inline">
            UKC Learning
          </span>
          <span class="hidden sm:inline-block ml-1 text-on-surface font-extrabold">Portal</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="Student_Lesson_Pathway.html"
          class="px-3 py-1.5 rounded-lg text-xs font-bold text-on-surface-variant hover:bg-surface-container-low transition-colors flex items-center gap-1.5 cursor-pointer">
          <span class="material-symbols-outlined text-base">map</span>
          Pathway
        </a>
      </div>
    </div>
  </header>

  <!-- Main Flashcard Container -->
  <main class="flex-1 max-w-xl mx-auto w-full px-4 py-4 sm:py-8 space-y-4 sm:space-y-6">
    <!-- Header Bar & Progress -->
    <div class="flex items-center justify-between gap-2">
      <a href="Student_Lesson_Pathway.html"
        class="p-2 text-outline hover:text-on-surface rounded-full hover:bg-surface-container-low min-w-[40px] min-h-[40px] flex items-center justify-center cursor-pointer">
        <span class="material-symbols-outlined text-xl">close</span>
      </a>

      <div class="flex-1 max-w-xs mx-2 space-y-1">
        <div class="flex justify-between text-[11px] font-bold text-outline">
          <span>Card 1 of 5</span>
          <span>20%</span>
        </div>
        <div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
          <div class="bg-primary h-full rounded-full transition-all duration-300" style="width: 20%;"></div>
        </div>
      </div>

      <span
        class="px-2.5 py-1 bg-surface-container-low text-xs font-bold text-on-surface-variant rounded-lg border border-outline-variant">
        Greetings
      </span>
    </div>

    <!-- 3D Flashcard -->
    <div class="perspective-1000 min-h-[300px] sm:min-h-[360px] cursor-pointer"
      onclick="document.getElementById('card-inner').classList.toggle('rotate-y-180'); document.getElementById('card-front').classList.toggle('hidden'); document.getElementById('card-back').classList.toggle('hidden');">
      <div id="card-inner"
        class="relative w-full h-full min-h-[300px] sm:min-h-[360px] rounded-3xl border-2 border-outline-variant/80 bg-surface-container-lowest p-6 sm:p-8 shadow-xl flex flex-col justify-between transition-transform duration-500 transform-style-3d">

        <!-- Front Side -->
        <div id="card-front" class="space-y-4 flex flex-col items-center justify-center flex-1">
          <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-outline font-label">
            Korean Flashcard • Tap to flip
          </span>

          <h2 class="text-4xl sm:text-5xl font-black text-on-surface font-headline tracking-wide">
            안녕하세요
          </h2>

          <p class="text-sm font-semibold text-primary font-mono bg-primary-fixed/40 px-3 py-1 rounded-full">
            [An-nyeong-ha-se-yo]
          </p>

          <button onclick="event.stopPropagation();"
            class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-low hover:bg-surface-container text-primary font-bold text-xs rounded-xl border border-outline-variant transition-colors min-h-[40px] cursor-pointer">
            <span class="material-symbols-outlined text-lg">volume_up</span>
            <span>Listen Pronunciation</span>
          </button>
        </div>

        <!-- Back Side -->
        <div id="card-back" class="space-y-4 flex flex-col items-center justify-center flex-1 hidden">
          <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-emerald-700 font-label">
            English Translation & Meaning
          </span>

          <h2 class="text-2xl sm:text-3xl font-bold text-on-surface font-headline text-center">
            Hello / Good day (Formal)
          </h2>

          <div
            class="p-4 bg-surface-container-low rounded-2xl border border-outline-variant text-center max-w-sm space-y-1">
            <p class="text-xs font-bold text-on-surface font-headline">"안녕하세요! 만나서 반갑습니다."</p>
            <p class="text-[11px] text-on-surface-variant italic font-label">Hello! Nice to meet you.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Rating Buttons -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <button
        class="py-3.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-700 font-bold text-xs sm:text-sm rounded-2xl border border-amber-500/30 flex items-center justify-center gap-2 cursor-pointer transition-colors min-h-[48px]">
        <span class="material-symbols-outlined text-lg">refresh</span>
        Hard (Needs Review)
      </button>

      <button
        class="py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-2xl shadow-md flex items-center justify-center gap-2 cursor-pointer transition-colors min-h-[48px]">
        <span class="material-symbols-outlined text-lg">check_circle</span>
        Easy (Got It!)
      </button>
    </div>
  </main>
</body>

</html>
